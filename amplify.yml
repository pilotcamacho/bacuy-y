# AWS Amplify Hosting build (Gen 2): deploys this branch's backend, then builds the PWA.
# The backend step writes amplify_outputs.json, which the app imports at build time
# (CLAUDE.md, PWA), so code and backend are always deployed together.
version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm install 24 && nvm use 24
        - node --version
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
    build:
      commands:
        - npm run lint
        - npm test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
